[package]
name = "touch-paint"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
